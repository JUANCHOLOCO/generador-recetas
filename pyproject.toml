[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "generador-recetas"
version = "0.1.0"
description = "Generador de instaladores SQL para cambios de catálogo"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.gui-scripts]
generador-recetas = "recetas.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recetas = ["**/*.j2", "**/*.qss"]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "golden: compara la salida generada con recetas reales",
    "ui: requiere widgets Qt",
]
qt_api = "pyside6"

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["recetas"]